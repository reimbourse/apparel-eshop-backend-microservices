[project]
name = "apparel-eshop-backend-microservices"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mypy>=2.4.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "ruff>=0.17.4",
]

[tool.uv.workspace]
members = [
    "services/*",
    "libs/*"
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.12"
strict = true
